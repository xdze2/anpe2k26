[project]
name = "anpe2k26"
version = "0.1.0"
description = "Assistant Numérique Pour l'Emploi"
readme = "README.md"
requires-python = ">=3.12.3"
dependencies = [
    "httpx>=0.28.1",
    "openai>=2.33.0",
    "pydantic-ai>=1.88.0",
    "pydantic-settings>=2.14.0",
    "pyyaml>=6.0.3",
    "ddgs>=9.0.0",
    "pydantic-ai-slim[mistral]>=1.88.0",
]

[tool.setuptools.packages.find]
include = ["anpe*"]

[tool.uv]
package = true

[project.scripts]
anpe = "anpe.cli:run"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
    "types-pyyaml>=6.0.12.20260408",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["anpe"]
